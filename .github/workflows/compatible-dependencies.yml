name: Test compatible dependencies

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/compatible-dependencies.yml'

permissions:
  contents: read

jobs:
  latest-bitmask:
    name: Latest compatible aliance/bitmask on PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer update aliance/bitmask --with-dependencies --no-interaction --no-progress
      - run: composer show aliance/bitmask
      - run: vendor/bin/phpunit
