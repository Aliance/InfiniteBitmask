name: PHP Composer

on:
  push:
    branches: [ "master", "5.0" ]
  pull_request:
    branches: [ "master", "5.0" ]

permissions:
  contents: read

jobs:
  build:
    name: Test on php ${{ matrix.php_version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php_version: ['8.3', '8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          coverage: none
          tools: composer:v2

      - run: composer validate
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  phpunit-13:
    name: PHPUnit 13 on PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Resolve this toolchain against the real PHP 8.4 runner.
      - run: composer config --unset platform.php
      - run: composer require --dev 'phpunit/phpunit:^13' --with-all-dependencies --no-interaction --no-progress
      - run: vendor/bin/phpunit

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run phpunit with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
